server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: unknown paths are client-side routes, not missing files.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Bundles carry a content hash in their name, so they can be cached for ever.
    # `expires` would emit its own Cache-Control, so only one directive is used here to
    # avoid sending the header twice.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html must never be cached, or a deploy keeps serving the old bundle names.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Proxied so the browser only ever talks to this origin.
    location /api/ {
        proxy_pass         http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /auth/ {
        proxy_pass         http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
