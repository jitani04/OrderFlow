# Routes everything to the panel, which serves the SPA and proxies /api and /auth to the
# API through its nginx config. One hostname, one origin, so CORS never applies.
#
# On AWS this is usually the AWS Load Balancer Controller instead of ingress-nginx, giving
# an ALB; see docs/deployment.md.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: orderflow
  namespace: orderflow
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
spec:
  ingressClassName: nginx
  rules:
    - host: orderflow.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: orderflow-admin-panel
                port:
                  number: 80
