# Development placeholder so `kubectl apply -k` works out of the box.
#
# This file is committed with throwaway values and must never hold real ones. On AWS the
# usual route is the External Secrets Operator or the Secrets Store CSI driver pulling from
# AWS Secrets Manager, so the values never exist in git at all. Note that a plain Kubernetes
# Secret is only base64-encoded, not encrypted, unless encryption at rest is enabled on etcd.
apiVersion: v1
kind: Secret
metadata:
  name: orderflow-secrets
  namespace: orderflow
type: Opaque
stringData:
  POSTGRES_USER: "orderflow"
  POSTGRES_PASSWORD: "orderflow-dev-password"
  POSTGRES_DB: "orderflow"

  ConnectionStrings__OrderFlowDb: "Host=postgres;Port=5432;Database=orderflow;Username=orderflow;Password=orderflow-dev-password"

  # Must be at least 32 characters; the API refuses to start otherwise.
  Jwt__SigningKey: "kubernetes-dev-signing-key-replace-me-in-real-environments"

  Seed__AdminUsername: "admin"
  Seed__AdminPassword: "admin123"
