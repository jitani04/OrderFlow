apiVersion: apps/v1
kind: Deployment
metadata:
  name: orderflow-web
  namespace: orderflow
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orderflow-web
  template:
    metadata:
      labels:
        app: orderflow-web
    spec:
      containers:
        - name: web
          image: orderflow-web:v1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          env:
            # The Service is orderflow-api here, not "api" as under docker-compose.
            # nginx resolves upstreams at startup, so this must match or it crash-loops.
            - name: API_UPSTREAM
              value: "orderflow-api:8080"
          livenessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 2
            periodSeconds: 10
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits:   { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
